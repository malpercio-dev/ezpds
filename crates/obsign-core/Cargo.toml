[package]
name = "obsign-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# No Apple crate and no `cfg(target_os)` here, ever (ADR-0039): platform code belongs to the
# shell or a platform crate that implements this crate's traits.
[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# The diagnostics log's breadcrumb timestamps.
chrono = { workspace = true }
# Only for classifying transport errors in the diagnostics log; the requests themselves go
# through custos-client.
reqwest = { workspace = true }
crypto = { workspace = true }
# The software signer and the device key's public-point decoding.
p256 = { workspace = true }
custos-client = { workspace = true }
# Only for `KeychainStore`, the trait `keystore::WalletKeychain` adapts the installed store to.
# custos-client already depends on it, so this adds no edge to the graph.
ios-device-key = { workspace = true }
# The share ceremony's seed generation and wiping.
rand_core = { workspace = true }
zeroize = { workspace = true }
# The ceremony state slots in `Core` and the migration/backup I/O.
tokio = { workspace = true }
http = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
multibase = { workspace = true }
urlencoding = { workspace = true }
# Client-side CAR validation for the user-held repo backup (`repo_backup`): the same no_std
# IPLD primitives repo-engine uses, not repo-engine itself.
cid = { workspace = true }
ipld-core = { workspace = true }
serde_ipld_dagcbor = { workspace = true }

[dev-dependencies]
httpmock = { workspace = true }
tempfile = { workspace = true }
# Tests build repo CARs by hand; the validator itself reads CIDs through `cid`.
multihash = { workspace = true }

[features]
# The thread-local in-memory `KeyStore` and the fallback that selects it when no store is
# installed. Enabled only from a dependent's `[dev-dependencies]`; refused in release builds
# (see `keystore`'s module doc).
test-support = []
