[package]
name = "obsign-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# No Apple crate and no `cfg(target_os)` here, ever (ADR-0039): platform code belongs to the
# shell or a platform crate that implements this crate's traits.
[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# The diagnostics log's breadcrumb timestamps.
chrono = { workspace = true }
# Only for classifying transport errors in the diagnostics log; the requests themselves go
# through custos-client.
reqwest = { workspace = true }
crypto = { workspace = true }
custos-client = { workspace = true }
# Only for `KeychainStore`, the trait `keystore::WalletKeychain` adapts the installed store to.
# custos-client already depends on it, so this adds no edge to the graph.
ios-device-key = { workspace = true }
# The share ceremony's seed generation and wiping.
rand_core = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
httpmock = { workspace = true }
base64 = { workspace = true }

[features]
# The thread-local in-memory `KeyStore` and the fallback that selects it when no store is
# installed. Enabled only from a dependent's `[dev-dependencies]`; refused in release builds
# (see `keystore`'s module doc).
test-support = []
