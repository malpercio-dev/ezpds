[package]
name = "custos-db"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# custos-db: the SQLite pool, the one linear migration log and its runner, and the query modules
# more than one feature reads. No HTTP stack: `cargo tree -p custos-db -e normal` must list
# neither axum nor reqwest (see AGENTS.md).

[features]
# `test_pool` and the seed helpers, for other crates' tests. Enable only under
# `[dev-dependencies]`.
test-support = []

[lints]
workspace = true

[dependencies]
common = { workspace = true, features = ["sqlx"] }
atrium-repo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
