[package]
name = "custos-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
reqwest = { workspace = true, features = ["form"] }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
p256 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
# DNS TXT lookup for handle resolution (PdsClient::resolve_handle).
hickory-resolver = { workspace = true }
# Zeroizes the DPoP private key scalar on drop (dpop.rs's `get_or_create`).
zeroize = { workspace = true }
# Software P-256 keypair generation for the DPoP proof key — the same functional core the
# rest of the workspace uses.
crypto = { workspace = true }
# The DPoP proof key is stored behind the same `KeychainStore` trait both apps' device keys
# already use, rather than a bespoke one — see dpop.rs's module doc.
ios-device-key = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
httpmock = { workspace = true }
