[package]
name = "custos-firehose"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# custos-firehose: the firehose serving side — subscribeRepos, the repo_seq retention sweep, and
# the operator's relay-status / request-crawl pair. The sequencer itself is custos-core's. Depends
# on custos-core and custos-db, never on `pds` or a sibling feature (see AGENTS.md).

[features]
# `test_support`: `test_app` and the core fixtures, for other crates' tests. Enable only under
# `[dev-dependencies]`.
test-support = ["custos-core/test-support"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
anyhow = { workspace = true }
common = { workspace = true, features = ["axum", "sqlx"] }
custos-db = { workspace = true }
custos-core = { workspace = true }
repo-engine = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
custos-db = { workspace = true, features = ["test-support"] }
custos-core = { workspace = true, features = ["test-support"] }
atrium-repo = { workspace = true }
ipld-core = { workspace = true }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
wiremock = { workspace = true }
