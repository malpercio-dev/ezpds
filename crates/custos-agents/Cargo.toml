[package]
name = "custos-agents"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# custos-agents: the auth.md agent feature crate — registration, the claim ceremony, sovereign
# child agents, provider events, the owner's management API, the claim sweep, and the agents
# capability entry. Depends on custos-core and custos-db, never on `pds` or a sibling feature
# (see AGENTS.md).

[features]
# `test_support`: `test_app` and the core fixtures, for other crates' tests. Enable only under
# `[dev-dependencies]`.
test-support = ["custos-core/test-support", "dep:tower", "dep:wiremock", "dep:zeroize"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
anyhow = { workspace = true }
common = { workspace = true, features = ["axum", "sqlx"] }
ceremony-journal = { workspace = true }
custos-db = { workspace = true }
custos-core = { workspace = true }
crypto = { workspace = true }
repo-engine = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
p256 = { workspace = true }
qrcodegen = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
# test-support only (see [features]).
tower = { workspace = true, optional = true }
wiremock = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
custos-db = { workspace = true, features = ["test-support"] }
custos-core = { workspace = true, features = ["test-support"] }
tower = { workspace = true }
wiremock = { workspace = true }
zeroize = { workspace = true }
