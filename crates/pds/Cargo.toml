[package]
name = "pds"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# pds is the network-facing binary (the Custos PDS): Axum HTTP server, XRPC
# handlers, OAuth, provisioning API, blob storage.
[[bin]]
name = "pds"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["ws"] }
http-body-util = { workspace = true }
common = { workspace = true, features = ["axum"] }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-prometheus = { workspace = true }
prometheus = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
urlencoding = { workspace = true }
qrcodegen = { workspace = true }
url = { workspace = true }
sqlx = { workspace = true }
crypto = { workspace = true }
repo-engine = { workspace = true }
atrium-repo = { workspace = true }
# rustls (not native-tls, via the workspace dep): no system OpenSSL needed in the
# container image. stream: body streaming for the service proxy.
reqwest = { workspace = true, features = ["stream"] }
base64 = { workspace = true }
rand_core = { workspace = true }
data-encoding = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
infer = { workspace = true }
lettre = { workspace = true }
subtle = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
hickory-resolver = { workspace = true }
iroh = { workspace = true }
# The notification relay's wire protocol, shared rather than mirrored: the pds is the client
# of the `ezpds/notify/0` ALPN this crate's library defines. Production code here touches only
# `protocol`; the relay's store, service, and APNs client are reachable too (the loopback e2e
# drives a real relay in-process) and are deliberately untouched outside that test.
notify-relay = { workspace = true }
jsonwebtoken = { workspace = true }
p256 = { workspace = true }
argon2 = { workspace = true }
chrono = { workspace = true }
unicode-segmentation = { workspace = true }
# Firehose frame encoding (com.atproto.sync.subscribeRepos): DAG-CBOR with CID tag-42
# links. ipld-core's serde feature is what makes `repo_engine::Cid` serialize as tag 42;
# serde_bytes is required for the CBOR byte-string `blocks` field.
serde_ipld_dagcbor = { workspace = true }
ipld-core = { workspace = true }
serde_bytes = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
tempfile = { workspace = true }
# Minting ES256K service-auth test tokens (the curve bsky.social signs with);
# production code only verifies, via the crypto crate's curve dispatch.
k256 = { workspace = true }
multibase = { workspace = true }
wiremock = { workspace = true }
# End-to-end WebSocket client for the subscribeRepos handler tests.
tokio-tungstenite = { workspace = true }
