[package]
name = "custos-oauth"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# custos-oauth: the OAuth authorization server feature crate — PAR, authorize + wallet consent,
# token (incl. the auth.md agent grants), revocation, discovery, JWKS, and the walletConsent
# capability entry. Depends on custos-core and custos-db, never on `pds` or a sibling feature
# (see AGENTS.md).

[features]
# `test_support`: `test_app` and the core fixtures, for other crates' tests. Enable only under
# `[dev-dependencies]`.
test-support = ["custos-core/test-support"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
common = { workspace = true, features = ["axum", "sqlx"] }
custos-db = { workspace = true }
custos-core = { workspace = true }
crypto = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
p256 = { workspace = true }
qrcodegen = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
custos-db = { workspace = true, features = ["test-support"] }
custos-core = { workspace = true, features = ["test-support"] }
tower = { workspace = true }
wiremock = { workspace = true }
