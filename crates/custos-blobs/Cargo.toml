[package]
name = "custos-blobs"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# custos-blobs: the blob feature crate — uploadBlob, listMissingBlobs, sync.getBlob/listBlobs, and
# the GC, scrub, and S3 mirror sweeps. Depends on custos-core and custos-db, never on `pds` or a
# sibling feature (see AGENTS.md).

[features]
# `test_support`: `test_app`, the GC fixtures, and the core fixtures, for other crates' tests.
# Enable only under `[dev-dependencies]`.
test-support = ["custos-core/test-support", "dep:tempfile"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
anyhow = { workspace = true }
atrium-repo = { workspace = true }
common = { workspace = true, features = ["axum", "sqlx"] }
custos-db = { workspace = true }
custos-core = { workspace = true }
crypto = { workspace = true }
repo-engine = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
hmac = { workspace = true }
ipld-core = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
# test-support only (see [features]).
tempfile = { workspace = true, optional = true }

[dev-dependencies]
custos-db = { workspace = true, features = ["test-support"] }
custos-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tower = { workspace = true }
wiremock = { workspace = true }
