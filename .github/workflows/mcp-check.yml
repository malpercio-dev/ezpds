name: MCP · check

# PR-time validation for the Custos MCP packages. The stdio server (tools/mcp) and the
# credential-forwarding sidecar (tools/mcp-sidecar) are BOTH excluded from the Linux
# `just ci-pds` gate: the stdio conformance suite needs a built `pds` binary (expensive),
# and neither had any CI lane at all. That left a real gap — the sidecar single-sources
# the stdio tool surface by relative import (tools/mcp/src/tools.ts), so a change to the
# stdio package can break the sidecar (and the shared `registerTools` refactor coupled
# them), yet nothing gated it.
#
# This lane closes the cheap half: it type-checks BOTH packages (catching a signature
# break in the shared surface), runs the sidecar's HERMETIC, self-contained suite
# (a stub PDS on loopback — no cargo build, no live network, ~5s), and builds + boots the
# sidecar's deploy image the way Railway does, which is the only check that sees the
# image's own dependency closure. It needs NO secrets and no macOS/cargo. The sidecar's MM-370 end-to-end suite (`pnpm test:e2e`) stays out because
# it needs the `pds` binary; folding it into the ci.yml PDS lane (which already builds
# `pds`) is a tracked follow-up. The stdio conformance suite (`just mcp-test`) has the same
# need but already runs in ci.yml's PDS gate, which reuses the binary that lane builds.
# Path-filtered so only MCP changes pay the cost.

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/mcp/**"
      - "tools/mcp-sidecar/**"
      # The sidecar image links tools/interop as a runtime dependency.
      - "tools/interop/**"
      - ".github/actions/setup-pnpm/**"
      - ".github/workflows/mcp-check.yml"
  push:
    branches: [main]
    paths:
      - "tools/mcp/**"
      - "tools/mcp-sidecar/**"
      # The sidecar image links tools/interop as a runtime dependency.
      - "tools/interop/**"
      - ".github/actions/setup-pnpm/**"
      - ".github/workflows/mcp-check.yml"
  workflow_dispatch:

# Read-only: type-checks and runs a hermetic suite; never deploys or touches secrets.
permissions:
  contents: read

concurrency:
  group: mcp-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-check:
    name: typecheck + sidecar suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm
        with:
          cache-dependency-path: |
            tools/mcp/pnpm-lock.yaml
            tools/mcp-sidecar/pnpm-lock.yaml

      # The sidecar single-sources tools/mcp's tool surface by relative import, and that
      # file resolves its own deps (zod, the MCP SDK) from tools/mcp's node_modules — so
      # BOTH installs are required for the sidecar to type-check and run.
      - name: Install deps (tools/mcp)
        working-directory: tools/mcp
        run: pnpm install --frozen-lockfile

      - name: Install deps (tools/mcp-sidecar)
        working-directory: tools/mcp-sidecar
        run: pnpm install --frozen-lockfile

      - name: Type-check the shared tool surface (tools/mcp)
        working-directory: tools/mcp
        run: pnpm check

      - name: Type-check the sidecar (tools/mcp-sidecar)
        working-directory: tools/mcp-sidecar
        run: pnpm check

      - name: Sidecar hermetic suite (registry, forwarding, sessions, redaction, transport, config)
        working-directory: tools/mcp-sidecar
        run: pnpm test

      # The deployed artifact, built the way Railway builds it (repo-root context,
      # tools/mcp-sidecar/Dockerfile). Type-checking and the hermetic suite both run
      # against the repo's own node_modules, so neither notices that the IMAGE is
      # missing a package — moving a dependency from devDependencies to dependencies
      # is enough to break the `--prod` install with everything else still green.
      # The image is thrown away; only the build and a boot smoke-test matter.
      - name: Build the deploy image
        run: docker build -f tools/mcp-sidecar/Dockerfile -t mcp-sidecar-ci .

      # A green build still ships a crash-loop if a runtime import cannot resolve, so
      # boot the image and require the MCP endpoint (which pulls in the whole shared
      # tool surface) to answer.
      - name: Smoke-test the image
        run: |
          docker run -d --name mcp-sidecar-ci -p 18080:8080 \
            -e PORT=8080 \
            -e MCP_SIDECAR_PDS_ORIGIN=http://127.0.0.1:9999 \
            -e MCP_SIDECAR_PUBLIC_ORIGIN=http://localhost:18080 \
            mcp-sidecar-ci
          for _ in $(seq 1 30); do
            curl -fsS -m 2 http://localhost:18080/ >/dev/null && break
            sleep 1
          done
          curl -fsS -m 5 http://localhost:18080/ | grep -q '"status":"ok"'
          curl -fsS -m 10 -X POST http://localhost:18080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | grep -q '"serverInfo"'

      - name: Sidecar container logs
        if: always()
        run: docker logs mcp-sidecar-ci || true
