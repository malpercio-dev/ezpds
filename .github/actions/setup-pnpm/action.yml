name: Setup pnpm + Node
description: >
  Install pnpm and Node 22 with the pnpm store cached. Shared by every workflow that
  runs a pnpm install (ci.yml, ios-pr-check.yml, mcp-check.yml) so the pnpm version and
  action pins live in one place instead of drifting between call sites.

inputs:
  cache-dependency-path:
    description: Passed through to actions/setup-node's cache-dependency-path.
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        # Exact pin — keep in lockstep with devenv.nix's `pkgs.pnpm_9` and the
        # "packageManager" field in apps/*/package.json, so `pnpm install
        # --frozen-lockfile` can never fail on a pnpm major/minor lockfile-format
        # difference between local and CI. The tools/* packages have no packageManager
        # field of their own but share this same pin.
        version: 9.15.9

    - name: Setup Node 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        # Cache the pnpm store (keyed by the lockfile hash). pnpm is already on PATH
        # from the action-setup step above, which setup-node's `cache: pnpm` requires.
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
