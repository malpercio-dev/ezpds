[workspace]
members = [
    "crates/pds",
    "crates/notify-relay",
    "crates/repo-engine",
    "crates/crypto",
    "crates/common",
    "apps/identity-wallet/src-tauri",
    "apps/admin-companion/src-tauri",
]
# Vendored Tauri plugins — path *dependencies* of the iOS apps, NOT workspace members: they
# pull `tauri` (GUI toolchain) which the Linux PDS CI lacks, so they must never build standalone
# via `cargo build --workspace`. Each builds only as its app's dep (excluded from ci-pds).
exclude = [
    "apps/identity-wallet/vendor/tauri-plugin-auth-session",
    "apps/admin-companion/vendor/tauri-plugin-sharesheet",
    # The swift-rs fork below is upstream's source plus one `--disable-sandbox` flag; it is
    # kept byte-minimal against upstream so the patch stays trivially re-appliable. As a path
    # dep it would otherwise be auto-promoted to a workspace member and linted, and upstream's
    # own warts (a `pub use` of a module holding only a `#[macro_export]` macro, which is
    # published at the crate root anyway) would fail `clippy -D warnings` on code we do not own.
    "apps/identity-wallet/swift-rs-patch",
    # Same byte-minimal-fork discipline as swift-rs-patch: upstream source plus one fix to
    # the MST `split_subtree` walk-up loop. See the [patch.crates-io] entry below.
    "vendor/atrium-repo-patch",
]
resolver = "2"

[workspace.package]
# Single source of truth for every crate's version AND the version the PDS reports at
# `_health` / `describeServer` (via `env!("CARGO_PKG_VERSION")`). Keep in lockstep with the
# release tag: `just set-version X.Y.Z` to bump (in a reviewed PR), then `just release` cuts the
# matching `v X.Y.Z` tag. The release CI also asserts the tag equals this version.
version = "0.16.1"
edition = "2021"
publish = false
# Matches the root LICENSE (AGPLv3 text, no "or later" grant filled in). "-only" is the
# deliberate choice: it keeps the license version fixed rather than auto-upgrading to a future
# GNU license the FSF might publish, which matters if this project ever wants to offer a
# commercial dual-license alongside AGPL.
license = "AGPL-3.0-only"

# Declare shared dependency versions here.
# Individual crates opt in with `{ workspace = true }`.
[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework (pds)
axum = "0.8"
# Body utilities (pds) — used to classify axum::body::to_bytes errors (length-limit vs stream).
http-body-util = "0.1"

# HTTP client (pds)
# default-features = false: no OpenSSL; future crates must opt in to rustls explicitly
# (the TLS feature was named rustls-tls before reqwest 0.13).
# http2 is a *default* feature, so dropping defaults silently drops it too — and without it
# reqwest never offers h2 in ALPN, which breaks the one HTTP/2-only peer in the tree:
# APNs (api.push.apple.com refuses HTTP/1.1 outright, so every push dies in transport).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
# reqwest's companion crate. Already in the tree transitively (single major); named directly so
# the identity-wallet can rebuild a `reqwest::Response` from parts (status/headers/body) after it
# has consumed a DPoP nonce-challenge body — `reqwest::Response: From<http::Response<T>>`.
http = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI argument parsing (pds)
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Observability
tracing = { version = "0.1", features = ["log"] }
# json: the machine-readable stdout format behind `[telemetry] log_format = "json"`.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# The four OTel crates move in lockstep (tracing-opentelemetry releases track the
# opentelemetry minor). 0.32 also unifies the workspace on reqwest 0.13 and tonic
# 0.14/tower 0.5 — older opentelemetry pinned reqwest 0.12 and tonic 0.12, keeping
# a second major of each compiled into every build.
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace", "metrics"] }
# Prometheus text-exposition bridge for the OTel meter behind `GET /metrics`. Chosen over a
# parallel `metrics`-facade stack because it rides the same opentelemetry 0.32 line as the
# trace pipeline (no second observability stack, shared Resource/service_name). Pulls
# `prometheus` 0.14 with default features off (no protobuf).
opentelemetry-prometheus = "0.32"
prometheus = { version = "0.14", default-features = false }

# HTTP middleware
# tower-http 0.6 (not 0.7): unifies with the 0.6.x already in the tree via tauri —
# 0.7 would reintroduce a dual-major compile of tower-http instead of removing one.
tower-http = { version = "0.6", features = ["trace", "cors"] }
tower = { version = "0.5", features = ["util"] }

# ATProto (repo-engine)
atrium-api = "0.25.8"
atrium-repo = "0.1.8"

# Crypto (crypto)
# rsky-crypto = "0.2"
# pem: the notify-relay reads Apple's APNs token-auth key straight off disk as a PKCS#8
# PEM `.p8` file, which is the only form Apple hands out. It enables pem-rfc7468, already
# in the tree at 0.7 via the same RustCrypto stack, so it adds no crate and no new major.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
# secp256k1 verification only (PLC ops signed by the reference ecosystem — bsky.social's
# rotation keys are zQ3…/secp256k1); signing stays P-256. Same RustCrypto family as p256.
k256 = { version = "0.13", features = ["ecdsa"] }
aes-gcm = "0.10"
multibase = "0.9"
# Foundation bindings for the wallet's iCloud ubiquity-container resolution
# (blob_backup.rs). Same major the vendored auth-session plugin pins, so the
# workspace stays on a single objc2 family version. iOS-only at the use site;
# per-class features are opted into there (features are additive).
objc2-foundation = "0.3"
# objc2 core (Retained, AnyThread) + the BackgroundTasks framework binding for the
# wallet's iOS background media-backup scheduling (bg_backup.rs), and block2 for the
# BGTaskScheduler launch/expiration handler blocks. Same objc2 0.6 family as
# objc2-foundation, so the lockfile stays on one major. iOS-only at the use site.
objc2 = "0.6"
objc2-background-tasks = "0.3"
block2 = "0.6"
# UIKit + UserNotifications bindings for the wallet's APNs device-token bridge (apns.rs): iOS
# delivers the token only to application-delegate methods, so the bridge needs the live
# UIApplication (to register, and to reach the delegate whose class the callbacks are installed
# on) and UNUserNotificationCenter (the permission prompt). Both are the same objc2 0.3
# generated-bindings family as objc2-foundation and were already in the lockfile transitively
# via the vendored auth-session plugin. iOS-only at the use site.
objc2-ui-kit = "0.3"
objc2-user-notifications = "0.3"
# SCNetworkReachability WWAN flag for the wallet's "Wi-Fi only" background-backup setting
# (bg_backup.rs) — BGProcessingTaskRequest can't express metered-network avoidance, so the
# sweep checks the live network type at fire time. Already in the tree transitively
# (hickory-resolver/reqwest); promoted to a direct iOS-target dep at the use site.
system-configuration = "0.7"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.21"
ciborium = "0.2"
data-encoding = "2"
sha2 = "0.10"
serde_ipld_dagcbor = "0.6"
# HMAC-SHA256 for the blob mirror's AWS SigV4 request signing (pds) — same RustCrypto family
# as sha2/hkdf, already resolved transitively.
hmac = "0.12"
# HKDF-SHA256 for deriving the recovery keypair from the escrow seed (same RustCrypto family as
# sha2/hmac, already resolved transitively via reqwest/rustls).
hkdf = "0.12"
# BLAKE3 in XOF mode for the Spaces LtHash element expansion (crypto). The reference
# permissioned-data implementation pins BLAKE3 with dkLen=2048; no other hash in the tree
# offers a compatible XOF. default-features = false drops std/rayon extras it doesn't need.
blake3 = { version = "1", default-features = false }
# RFC 9180 HPKE for the notification relay's sealed payloads (crypto). 0.13, not 0.14:
# 0.14 pulls its own p256 0.14 / aes-gcm 0.11 / hkdf 0.13 line (plus p384 + p521, which its
# coarse `nistp` feature can't exclude), compiling a second major of three crypto crates the
# workspace deliberately keeps single-major. 0.13 resolves onto the existing p256 0.13 /
# aes-gcm 0.10 / hkdf 0.12 and its per-curve `p256` feature drags in nothing else. Same RFC,
# same pinned suite. default-features = false drops x25519.
hpke = { version = "0.13", default-features = false, features = ["alloc", "p256"] }
# hpke 0.13 takes its CSPRNG from rand_core 0.9 — already in the workspace tree alongside 0.6 and
# 0.10, so this adds no new major. It depends on rand_core with default features off, so
# `OsRng` isn't compiled in; this renamed alias turns the `os_rng` feature on for that same 0.9
# crate rather than adding a second copy. Renamed because `rand_core` above is the 0.6 line.
rand_core_os = { package = "rand_core", version = "0.9", features = ["os_rng"] }
zeroize = "1"
urlencoding = "2"
# QR-code matrix generation for the wallet-confirmed OAuth consent page (pds): the consent page
# renders a QR encoding the pending request's `request_id` so the identity wallet can scan it
# cross-device instead of typing the code. `qrcodegen` is the Nayuki reference encoder — pure Rust,
# MIT-licensed, zero transitive dependencies; the PDS renders the matrix to an inline SVG itself.
qrcodegen = "1.8"
# URL parsing for the atproto-proxy SSRF guard (pds) — already resolved transitively via
# reqwest; declared directly so `url::Host` is nameable for host-type matching.
url = "2"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
# Unicode grapheme-cluster segmentation for lexicon `maxGraphemes` record validation (pds) —
# the reference `@atproto/lexicon` counts extended grapheme clusters, not code points.
unicode-segmentation = "1"

# JWT (pds auth)
jsonwebtoken = "9"

# Password hashing (pds createSession)
argon2 = { version = "0.5", features = ["password-hash"] }

# ATProto handle resolution — DNS TXT fallback (pds)
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }

# Iroh QUIC tunnel — NAT-traversing device↔pds endpoint (pds)
iroh = "1"

# Blob MIME detection (pds)
infer = "0.19"

# Outbound email — SMTP delivery for the password-reset / email-confirmation / email-update flows
# (pds). rustls (not native-tls) to reuse reqwest's TLS stack instead of compiling a second TLS
# backend and pulling in system OpenSSL. default-features = false drops native-tls; we re-add only
# the builder + SMTP transport + async-tokio-rustls transport + hostname (EHLO) we actually use.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }

# Mobile apps (Tauri v2 — shared by identity-wallet + admin-companion).
# Now that two crates consume these, their versions live here per the workspace policy;
# members opt in with `{ workspace = true }` (and add crate-specific features locally).
tauri = { version = "2" }
tauri-build = { version = "2" }
tauri-plugin-log = "2"
# Camera QR scanning (identity-wallet OAuth consent scan path + admin-companion pairing). Mobile-
# only; each app opts in under its iOS/android target table and registers it behind `#[cfg(mobile)]`.
tauri-plugin-barcode-scanner = "2"
log = "0.4"
security-framework = { version = "3" }

# Testing
tempfile = "3"

# Intra-workspace
common = { path = "crates/common" }
crypto = { path = "crates/crypto" }
repo-engine = { path = "crates/repo-engine" }
notify-relay = { path = "crates/notify-relay" }

# ── Local patches ─────────────────────────────────────────────────────────────
#
# swift-rs 1.0.7 does not pass --disable-sandbox to `swift build`. On macOS 26
# (Tahoe), sandbox_apply() returns EPERM during manifest compilation, breaking
# the Tauri ios-api build step. The local patch adds --disable-sandbox.
# Remove when swift-rs ships a fix upstream. Tracked in docs/ios-upstream-bugs.md (Bug 1).
[patch.crates-io]
swift-rs = { path = "apps/identity-wallet/swift-rs-patch" }

# atrium-repo 0.1.8's MST `split_subtree` silently drops sibling subtrees when a
# higher-layer insert splits a node and one side of the deepest split is empty —
# whole collections vanish from a repo with no error and no firehose delete
# (atrium-rs/atrium#343; destroyed 64 records from a production repo on 2026-08-27).
# The local patch re-attaches the orphaned parent-level entries on both sides.
# Guarded by crates/repo-engine/tests/mst_split_gate.rs, which fails against the
# unpatched crate. Remove when upstream ships a fix.
atrium-repo = { path = "vendor/atrium-repo-patch" }
