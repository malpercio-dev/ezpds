# ezpds-ios-template — shared custom XcodeGen project template for BOTH iOS apps
# (identity-wallet, admin-companion), wired via `bundle > iOS > template` in each
# app's tauri.conf.json. `cargo tauri ios init` renders this Handlebars template
# into gen/apple/project.yml on EVERY init (unconditionally, unlike the other
# generated files, which are only created when missing), then runs
# `xcodegen generate` to rebuild project.pbxproj from it. That makes this file —
# not the gitignored generated project — the durable home of the Xcode-project
# workarounds that ios-postinit.sh used to re-apply by regex-patching the pbxproj
# (see docs/ios-upstream-bugs.md for each workaround's upstream bug).
#
# upstream-version: tauri-cli 2.11.4
# Forked from crates/tauri-cli/templates/mobile/ios/project.yml at that tag; the
# pristine copy is committed next to this file as upstream-project.yml so the fork
# can be diffed against it. When bumping the tauri-cli pin (the `cargo binstall
# tauri-cli --version` lines in .github/workflows/*.yml), refresh
# upstream-project.yml from the new tag, re-merge upstream's changes into this
# fork, and bump the upstream-version line above — scripts/ios-template-check.sh
# (part of `just ci` / `ci-pds`) fails until the versions are back in lockstep.
#
# ezpds changes vs upstream (each marked with an `ezpds:` comment inline):
#   1. Externals gets `buildPhase: none` — keeps libapp.a out of Copy Bundle
#      Resources (App Store rejects a raw staticlib in the .app; tauri#13578).
#   2. Target settings force ENABLE_USER_SCRIPT_SANDBOXING off (macOS 26 blocks
#      Cargo's readdir under the Run Script sandbox), allow the spurious
#      "entitlements modified during build" (per-build pbxproj restamp race), and
#      link the Apple frameworks the Rust staticlib needs via OTHER_LDFLAGS
#      (rendered from `bundle > iOS > frameworks` in tauri.conf.json — rustc's
#      #[link(kind="framework")] directives are invisible to Xcode when the crate
#      is linked as a staticlib).
#   3. The "Build Rust Code" phase re-creates the dev environment before invoking
#      the Tauri CLI — Xcode runs it in a clean shell that inherits neither the
#      devenv PATH nor the Apple-toolchain overrides from ios-env.sh.
#   4. The layered Icon Composer document (apps/<app>/AppIcon.icon — the iOS 26
#      Liquid Glass icon) is referenced IN PLACE as a resource, with a fileTypes
#      mapping so XcodeGen treats the .icon package as one file. Xcode 26 prefers
#      it over the same-named appiconset, which stays as the older-toolchain
#      fallback (regenerated by postinit's Patch G).
#   5. A Notification Service Extension target ({{app.name}}_NSE, Swift-only) that
#      HPKE-opens the sealed push payloads the notification relay carries, plus a
#      logic-test bundle for it. Sources are referenced IN PLACE from the repo-root
#      ios/ tree — ONE implementation for both app lanes, the same shape as
#      scripts/ios/. See the target definitions at the bottom of this file for why
#      they are gated to the wallet's bundle id.
#   NOTE on entitlements: this file keeps tauri-cli's DEFAULT entitlements path
#      ({{app.name}}_iOS/{{app.name}}_iOS.entitlements). tauri-cli's own build-time
#      codesign reads that default path regardless of what this template says, so
#      repointing it here leaves that path fileless and breaks signing ("cannot
#      read entitlement data"). The wallet's iCloud entitlements are instead
#      injected INTO the generated default file after init by ios-postinit.sh's
#      Patch H (from the tracked apps/<app>/src-tauri/Entitlements.ios.plist),
#      the same tracked-source→gitignored-tree pattern as the Patch G app icon.
name: {{app.name}}
options:
  bundleIdPrefix: {{app.identifier}}
  deploymentTarget:
    iOS: {{apple.ios-version}}
  # ezpds: treat Icon Composer .icon packages as single-file resources — XcodeGen
  # otherwise explodes the package into loose icon.json/svg resources, which Xcode
  # does not recognize as an app icon (XcodeGen#1556).
  fileTypes:
    icon:
      file: true
fileGroups: [{{join file-groups}}]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: {{app.stylized-name}}
      PRODUCT_BUNDLE_IDENTIFIER: {{app.identifier}}
      {{#if apple.development-team}}
      DEVELOPMENT_TEAM: {{apple.development-team}}
      {{/if}}
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  {{app.name}}_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # ezpds: the layered Icon Composer document (iOS 26 Liquid Glass), checked in
      # at apps/<app>/AppIcon.icon and referenced in place — ../../.. resolves from
      # gen/apple to the app dir, so nothing needs copying into the generated tree.
      # Compiled/validated by actool in `just <recipe>-pr-check` (`just _icon-compile`).
      - path: ../../../AppIcon.icon
        buildPhase: resources
      # ezpds: no buildPhase for Externals — XcodeGen otherwise infers `resources`
      # and copies the raw libapp.a into the .app, which App Store upload rejects
      # ("Invalid bundle structure", tauri#13578). The staticlib is still LINKED
      # via the `framework: libapp.a` dependency + LIBRARY_SEARCH_PATHS below.
      - path: Externals
        buildPhase: none
      - path: {{app.name}}_iOS
      - path: {{app.asset-dir}}
        buildPhase: resources
        type: folder
      {{~#each asset-catalogs}}
      - {{prefix-path this}}{{/each}}
      {{~#each ios-additional-targets}}
      - path: {{prefix-path this}}{{/each}}
      - path: LaunchScreen.storyboard
    info:
      path: {{app.name}}_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: {{apple.bundle-version-short}}
        CFBundleVersion: "{{apple.bundle-version}}"
        {{~#each apple.plist-pairs}}
        {{this.key}}: {{this.value}}{{/each}}
    entitlements:
      # tauri-cli's default path. Its CONTENT is overwritten after init by
      # ios-postinit.sh's Patch H (from the tracked src-tauri/Entitlements.ios.plist)
      # — see the header note. Do NOT repoint this: tauri's build-time codesign
      # reads this exact path and fails if it is fileless.
      path: {{app.name}}_iOS/{{app.name}}_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
      {{~#if ios-command-line-arguments}}
      commandLineArguments:
      {{~#each ios-command-line-arguments}}
        "{{this}}": true
      {{/each}}{{~/if}}
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [{{join ios-valid-archs}}]
        VALID_ARCHS: {{~#each ios-valid-archs}} {{this}} {{/each}}
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        # ezpds: macOS 26's Run Script sandbox blocks Cargo's readdir during
        # package fingerprinting (docs/ios-upstream-bugs.md Bug 2). Quoted so
        # every YAML parser reads the same string (bare NO is a YAML 1.1 bool).
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # ezpds: `cargo tauri ios build` restamps the pbxproj on every run, which
        # makes Xcode's incremental packaging intermittently flag the
        # (never-actually-modified) entitlements file as "modified during the
        # build" (docs/ios-upstream-bugs.md Bug 3).
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
        # ezpds: link the Apple frameworks the Rust staticlib's dependencies
        # reference (from `bundle > iOS > frameworks` in tauri.conf.json). The
        # same list also renders `- sdk:` dependencies below (upstream behavior);
        # the explicit OTHER_LDFLAGS is belt-and-braces for staticlib symbol
        # resolution — duplicate -framework flags are harmless to the linker.
        OTHER_LDFLAGS: $(inherited){{#each ios-frameworks}} -framework {{this}}{{/each}}
      groups: [app]
    dependencies:
      - framework: {{ lib-output-file-name }}
        embed: false
      {{~#each ios-libraries}}
      - framework: {{this}}
        embed: false{{/each}}{{#if ios-vendor-frameworks}}{{~#each ios-vendor-frameworks}}
      - framework: {{this}}{{/each}}{{/if}}{{#if ios-vendor-sdks}}{{~#each ios-vendor-sdks}}
      - sdk: {{prefix-path this}}{{/each}}{{/if}}
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework{{#if this.ios-frameworks}}{{~#each ios-frameworks}}
      - sdk: {{this}}.framework{{/each}}{{/if}}
      - sdk: WebKit.framework
      {{~#if (eq app.identifier "dev.malpercio.identitywallet")}}
      # ezpds: embed the Notification Service Extension into the app's PlugIns
      # directory. This dependency — not the target definition alone — is what makes
      # the extension part of the archive, so it carries the same bundle-id gate.
      - target: {{app.name}}_NSE
        embed: true
      {{~/if}}
    preBuildScripts:
      {{~#each ios-pre-build-scripts}}{{#if this.path}}
      - path {{this.path}}{{/if}}{{#if this.script}}
      - script: {{this.script}}{{/if}}{{#if this.name}}
        name: {{this.name}}{{/if}}{{#if this.input-files}}
        inputFiles: {{~#each this.input-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.output-files}}
        outputFiles: {{~#each this.output-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.input-file-lists}}
        inputFileLists: {{~#each this.output-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.output-file-lists}}
        outputFileLists: {{~#each this.output-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.shell}}
        shell: {{this.shell}}{{/if}}{{#if this.show-env-vars}}
        showEnvVars: {{this.show_env_vars}}{{/if}}{{#if this.run-only-when-installing}}
        runOnlyWhenInstalling: {{this.run-only-when-installing}}{{/if}}{{#if this.based-on-dependency-analysis}}
        basedOnDependencyAnalysis: {{this.based-on-dependency-analysis}}{{/if}}{{#if this.discovered-dependency-file}}
        discoveredDependencyFile: {{this.discovered-dependency-file}}{{/if}}
      {{~/each}}

      # ezpds: Xcode runs this phase in a clean shell that inherits neither the
      # devenv PATH (cargo, cargo-tauri, node, pnpm) nor the Apple-toolchain
      # overrides — re-create both before invoking the Tauri CLI. Paths are
      # derived from $SRCROOT (= apps/<app>/src-tauri/gen/apple), never baked in,
      # so the same committed template works on every machine and on CI.
      - script: |
          # >>> ezpds-ios-env >>>
          export EZPDS_IOS_BUILD=1
          if [ -d "$SRCROOT/../../../../../.devenv/profile/bin" ]; then
            PATH="$SRCROOT/../../../../../.devenv/profile/bin:$PATH"
          fi
          PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          export PATH
          if [ -f "$SRCROOT/../../../scripts/ios-env.sh" ]; then
            . "$SRCROOT/../../../scripts/ios-env.sh"
          fi
          # <<< ezpds-ios-env <<<
          {{ tauri-binary }} {{ tauri-binary-args-str }} -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/{{ lib-output-file-name }}
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/{{ lib-output-file-name }}
    {{~#if ios-post-compile-scripts}}
    postCompileScripts:
      {{~#each ios-post-compile-scripts}}{{#if this.path}}
      - path {{this.path}}{{/if}}{{#if this.script}}
      - script: {{this.script}}{{/if}}{{#if this.name}}
        name: {{this.name}}{{/if}}{{#if this.input-files}}
        inputFiles: {{~#each this.input-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.output-files}}
        outputFiles: {{~#each this.output-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.input-file-lists}}
        inputFileLists: {{~#each this.output-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.output-file-lists}}
        outputFileLists: {{~#each this.output-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.shell}}
        shell: {{this.shell}}{{/if}}{{#if this.show-env-vars}}
        showEnvVars: {{this.show_env_vars}}{{/if}}{{#if this.run-only-when-installing}}
        runOnlyWhenInstalling: {{this.run-only-when-installing}}{{/if}}{{#if this.based-on-dependency-analysis}}
        basedOnDependencyAnalysis: {{this.based-on-dependency-analysis}}{{/if}}{{#if this.discovered-dependency-file}}
        discoveredDependencyFile: {{this.discovered-dependency-file}}{{/if}}
      {{~/each~}}
    {{~/if~}}
    {{~#if ios-post-build-scripts}}
    postBuildScripts:
      {{~#each ios-post-build-scripts}}{{#if this.path}}
      - path {{this.path}}{{/if}}{{#if this.script}}
      - script: {{this.script}}{{/if}}{{#if this.name}}
        name: {{this.name}}{{/if}}{{#if this.input-files}}
        inputFiles: {{~#each this.input-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.output-files}}
        outputFiles: {{~#each this.output-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.input-file-lists}}
        inputFileLists: {{~#each this.output-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.output-file-lists}}
        outputFileLists: {{~#each this.output-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.shell}}
        shell: {{this.shell}}{{/if}}{{#if this.show-env-vars}}
        showEnvVars: {{this.show_env_vars}}{{/if}}{{#if this.run-only-when-installing}}
        runOnlyWhenInstalling: {{this.run-only-when-installing}}{{/if}}{{#if this.based-on-dependency-analysis}}
        basedOnDependencyAnalysis: {{this.based-on-dependency-analysis}}{{/if}}{{#if this.discovered-dependency-file}}
        discoveredDependencyFile: {{this.discovered-dependency-file}}{{/if}}
      {{~/each~}}
    {{~/if}}

  # ezpds change 5: the Notification Service Extension, and its logic-test bundle.
  #
  # GATED TO THE WALLET'S BUNDLE ID, deliberately. This template is shared by both
  # apps, but an app extension is a SEPARATE BUNDLE — it needs its own explicit App
  # ID, its own distribution profile, and its own IOS_MOBILE_PROVISION_* secret before
  # a signed build that embeds it can be archived (docs/ios-cicd.md, "Push
  # notifications: three artifacts"). Rendering it for admin-companion too would cost a
  # second set of those artifacts for an extension that cannot decrypt anything: the
  # console declares no keychain-access-groups and registers no notification keys, so
  # its extension would read an empty shared group and render the unverified notice for
  # every push. The console's own notification adoption is where that changes — and where this gate
  # widens, in the same change that adds the console's shared group and registration.
  #
  # `eq` is a handlebars-rust built-in (registered in `Registry::setup_builtins`), not a
  # cargo-mobile2 helper, so it survives a tauri-cli bump that changes the helper set.
  # The literal is the same bundle id `just bundle-identity-check` pins; a rename has to
  # move both, which is why that script's rename checklist names this file.
  {{#if (eq app.identifier "dev.malpercio.identitywallet")}}
  {{app.name}}_NSE:
    type: app-extension
    platform: iOS
    sources:
      # ONE shared implementation at the repo root — no per-app copy to drift, the same
      # arrangement as scripts/ios/. Swift-only: decryption is CryptoKit, so there is no
      # second Rust staticlib and none of the toolchain machinery the app target needs.
      - path: ../../../../../ios/NotificationService
    info:
      path: {{app.name}}_NSE/Info.plist
      properties:
        CFBundleDisplayName: {{app.stylized-name}} Notifications
        CFBundleShortVersionString: {{apple.bundle-version-short}}
        CFBundleVersion: "{{apple.bundle-version}}"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{app.identifier}}.NotificationService
        # Pinned rather than derived from the target name: it is half of
        # NSExtensionPrincipalClass above, and the name the test bundle's sources
        # compile under. A rename that silently changed it would leave iOS unable to
        # instantiate the principal class — a failure that looks exactly like a push
        # that never arrived.
        PRODUCT_MODULE_NAME: NotificationService
        PRODUCT_NAME: {{app.name}}_NSE
        # Path-relative to gen/apple, i.e. apps/<app>/src-tauri/Entitlements.NSE.plist.
        # Referenced directly rather than installed by ios-postinit's Patch H: that patch
        # exists because tauri's build-time codesign reads the APP target's default
        # entitlements path whatever the template says. Tauri signs only the app — Xcode
        # signs the extension from this setting — so the tracked file is used as-is.
        CODE_SIGN_ENTITLEMENTS: ../../Entitlements.NSE.plist
        {{#if apple.development-team}}
        DEVELOPMENT_TEAM: {{apple.development-team}}
        {{/if}}
        # Same two Xcode workarounds the app target carries (see the header): the
        # extension is archived by the same build, so it meets the same sandbox and
        # entitlements-restamp behavior.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
    dependencies:
      # The only framework worth naming: Swift autolinks CryptoKit, Security and
      # Foundation from their `import`s, and this one matches what Apple's own NSE
      # template declares.
      - sdk: UserNotifications.framework

  {{app.name}}_NSETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # The extension's sources are compiled INTO the test bundle rather than linked
      # from the extension target. An app-extension target has no testable module to
      # import (there is no TEST_HOST an extension can be loaded into), so recompiling
      # ~400 lines is what makes these logic tests runnable at all — and it keeps them
      # host-independent, so `⌘U` needs no push, no device, and no registered key.
      - path: ../../../../../ios/NotificationService
      - path: ../../../../../ios/NotificationServiceTests
      # The Rust-generated golden HPKE vectors, referenced IN PLACE — there is no copy
      # under ios/ that could fall out of step with the crate that produces them.
      - path: ../../../../../crates/crypto/tests/fixtures/notify/hpke-notify-v1.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{app.identifier}}.NotificationServiceTests
        {{#if apple.development-team}}
        DEVELOPMENT_TEAM: {{apple.development-team}}
        {{/if}}
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  {{/if}}

# A dedicated scheme for the extension's logic tests, so `⌘U` (or `xcodebuild test
# -scheme <app>_NSETests`) runs them WITHOUT building the app — which would mean the
# whole Rust staticlib, the frontend bundle, and the JSON-RPC dance with a running
# `cargo tauri ios dev`. Attaching them to the app's scheme instead would have made the
# fixture cross-check cost a full app build every time.
{{#if (eq app.identifier "dev.malpercio.identitywallet")}}
schemes:
  {{app.name}}_NSETests:
    build:
      targets:
        {{app.name}}_NSETests: [test]
    test:
      targets:
        - {{app.name}}_NSETests
{{/if}}
